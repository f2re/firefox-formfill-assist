<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FormFill Assistant workflow</title>
  <desc id="desc">Eight-step flow from opening a form through AI JSON generation, review and safe filling. No auto-submit, sensitive fields are blocked, user review is mandatory.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B66F2"/><stop offset=".52" stop-color="#16C8D5"/><stop offset="1" stop-color="#7246EF"/></linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2386FF"/><stop offset="1" stop-color="#6747F5"/></linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0FC9C1"/><stop offset="1" stop-color="#2DD785"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A235B" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2386FF"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="#F7FAFF"/>
  <rect x="38" y="36" width="1524" height="136" rx="30" fill="url(#hero)"/>
  <g transform="translate(72 60)"><rect width="84" height="84" rx="22" fill="#fff" opacity=".18"/><rect x="14" y="16" width="50" height="54" rx="10" fill="#fff"/><rect x="21" y="29" width="35" height="7" rx="3.5" fill="#A6D1FF"/><rect x="21" y="43" width="25" height="7" rx="3.5" fill="#A6D1FF"/><path d="m22 58 7 7 18-19" fill="none" stroke="#16BFD0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M57 50c6 3 11 4 16 5v8c0 8-5 14-16 18-10-4-15-10-15-18v-8c5-1 9-2 15-5Z" fill="#5E48F3" stroke="#fff" stroke-width="3"/></g>
  <text x="182" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="760" fill="#fff">FormFill Assistant</text>
  <text x="184" y="138" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#EAF6FF">Screenshot → prompt → strict JSON → preview → safe fill</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g fill="none" stroke="#2386FF" stroke-width="5" marker-end="url(#arrow)" opacity=".75"><path d="M372 340h42"/><path d="M764 340h42"/><path d="M1156 340h42"/><path d="M1394 471c0 52-31 72-74 72H1214"/><path d="M1198 642h-42"/><path d="M806 642h-42"/><path d="M414 642h-42"/></g>
    <g filter="url(#shadow)"><rect x="58" y="214" width="314" height="256" rx="24" fill="#fff" stroke="#DCE8F7"/><circle cx="94" cy="252" r="22" fill="url(#step)"/><text x="94" y="260" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">1</text><text x="130" y="260" font-size="24" font-weight="730" fill="#102352">Open form</text><rect x="86" y="292" width="258" height="136" rx="16" fill="#F2F7FF" stroke="#D4E2F4"/><circle cx="108" cy="313" r="5" fill="#FF6BC7"/><circle cx="124" cy="313" r="5" fill="#42E3E2"/><circle cx="140" cy="313" r="5" fill="#55E7A6"/><rect x="105" y="339" width="216" height="20" rx="8" fill="#fff" stroke="#BED3EF"/><rect x="105" y="372" width="216" height="20" rx="8" fill="#fff" stroke="#BED3EF"/><rect x="105" y="405" width="152" height="10" rx="5" fill="#9FC7F7"/><text x="86" y="451" font-size="17" fill="#60708F">Any regular Firefox page</text></g>
    <g filter="url(#shadow)"><rect x="414" y="214" width="350" height="256" rx="24" fill="#fff" stroke="#DCE8F7"/><circle cx="450" cy="252" r="22" fill="url(#step)"/><text x="450" y="260" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">2</text><text x="486" y="260" font-size="24" font-weight="730" fill="#102352">Analyze form</text><rect x="448" y="297" width="286" height="125" rx="16" fill="#F2F7FF"/><g font-size="15" font-weight="760" fill="#fff"><rect x="466" y="314" width="48" height="28" rx="8" fill="#237FF8"/><text x="490" y="333" text-anchor="middle">F01</text><rect x="466" y="351" width="48" height="28" rx="8" fill="#237FF8"/><text x="490" y="370" text-anchor="middle">F02</text><rect x="466" y="388" width="48" height="28" rx="8" fill="#237FF8"/><text x="490" y="407" text-anchor="middle">F03</text></g><rect x="529" y="316" width="177" height="24" rx="9" fill="#fff" stroke="#BBD0ED"/><rect x="529" y="353" width="177" height="24" rx="9" fill="#fff" stroke="#BBD0ED"/><rect x="529" y="390" width="177" height="24" rx="9" fill="#fff" stroke="#BBD0ED"/><text x="448" y="451" font-size="17" fill="#60708F">Stable Fxx / iframe-aware IDs</text></g>
    <g filter="url(#shadow)"><rect x="806" y="214" width="350" height="256" rx="24" fill="#fff" stroke="#DCE8F7"/><circle cx="842" cy="252" r="22" fill="url(#step)"/><text x="842" y="260" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">3</text><text x="878" y="250" font-size="22" font-weight="730" fill="#102352">Capture screenshot</text><text x="878" y="277" font-size="22" font-weight="730" fill="#102352">+ strict prompt</text><rect x="838" y="306" width="160" height="112" rx="14" fill="#F2F7FF" stroke="#78AFFF" stroke-dasharray="8 7"/><rect x="855" y="326" width="126" height="18" rx="7" fill="#DCE9F7"/><rect x="855" y="356" width="126" height="18" rx="7" fill="#DCE9F7"/><rect x="855" y="386" width="87" height="18" rx="7" fill="#DCE9F7"/><rect x="1019" y="306" width="105" height="112" rx="14" fill="#F9FCFF" stroke="#D3E2F4"/><text x="1036" y="335" font-size="16" font-weight="720" fill="#196BEF">PROMPT</text><text x="1036" y="363" font-size="14" fill="#526485">JSON only</text><text x="1036" y="387" font-size="14" fill="#526485">No guessing</text><text x="838" y="451" font-size="17" fill="#60708F">Values masked before capture</text></g>
    <g filter="url(#shadow)"><rect x="1198" y="214" width="344" height="256" rx="24" fill="#fff" stroke="#DCE8F7"/><circle cx="1234" cy="252" r="22" fill="url(#step)"/><text x="1234" y="260" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">4</text><text x="1270" y="260" font-size="24" font-weight="730" fill="#102352">Vision AI</text><rect x="1230" y="304" width="122" height="116" rx="20" fill="#F2F7FF" stroke="#C8DBF3"/><rect x="1246" y="326" width="90" height="14" rx="6" fill="#C5D9F0"/><rect x="1246" y="351" width="90" height="14" rx="6" fill="#C5D9F0"/><rect x="1246" y="376" width="62" height="14" rx="6" fill="#C5D9F0"/><path d="M1368 362h36" stroke="#2386FF" stroke-width="5" marker-end="url(#arrow)"/><rect x="1411" y="304" width="99" height="116" rx="24" fill="url(#step)"/><circle cx="1460" cy="355" r="25" fill="none" stroke="#fff" stroke-width="4"/><path d="M1442 355h36M1460 337v36M1447 342l26 26M1473 342l-26 26" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/><text x="1230" y="451" font-size="17" fill="#60708F">ChatGPT · Claude · Gemini · local</text></g>
    <g filter="url(#shadow)"><rect x="1198" y="518" width="344" height="250" rx="24" fill="#fff" stroke="#DCE8F7"/><circle cx="1234" cy="556" r="22" fill="url(#step)"/><text x="1234" y="564" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">5</text><text x="1270" y="564" font-size="24" font-weight="730" fill="#102352">Receive strict JSON</text><rect x="1230" y="600" width="280" height="122" rx="16" fill="#101B3B"/><text x="1251" y="628" font-size="16" fill="#92BFFF">{</text><text x="1271" y="654" font-size="15" fill="#9CE6CD">"F01": "Jane Doe",</text><text x="1271" y="680" font-size="15" fill="#9CE6CD">"F02": { "action": "select" }</text><text x="1251" y="706" font-size="16" fill="#92BFFF">}</text><text x="1230" y="750" font-size="17" fill="#60708F">No prose, selectors or submit command</text></g>
    <g filter="url(#shadow)"><rect x="806" y="518" width="350" height="250" rx="24" fill="#fff" stroke="#DCE8F7"/><circle cx="842" cy="556" r="22" fill="url(#step)"/><text x="842" y="564" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">6</text><text x="878" y="564" font-size="24" font-weight="730" fill="#102352">Paste JSON</text><rect x="838" y="601" width="286" height="121" rx="16" fill="#F2F7FF" stroke="#C5D8F1" stroke-dasharray="8 7"/><path d="M972 626v45m-16-16 16 16 16-16" fill="none" stroke="#2679EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="981" y="703" text-anchor="middle" font-size="17" fill="#526485">Paste from clipboard</text><text x="838" y="750" font-size="17" fill="#60708F">Parser validates contract and page</text></g>
    <g filter="url(#shadow)"><rect x="414" y="518" width="350" height="250" rx="24" fill="#fff" stroke="#DCE8F7"/><circle cx="450" cy="556" r="22" fill="url(#step)"/><text x="450" y="564" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">7</text><text x="486" y="564" font-size="24" font-weight="730" fill="#102352">Review preview</text><g font-size="15"><rect x="448" y="603" width="286" height="31" rx="9" fill="#F3FBF7"/><text x="464" y="624" fill="#17315D">F01  Jane Doe</text><text x="691" y="624" fill="#16875E">ok ✓</text><rect x="448" y="643" width="286" height="31" rx="9" fill="#FFF9EC"/><text x="464" y="664" fill="#17315D">F02  Product Manager</text><text x="665" y="664" fill="#A06C08">review</text><rect x="448" y="683" width="286" height="31" rx="9" fill="#FFF1F3"/><text x="464" y="704" fill="#17315D">Password</text><text x="682" y="704" fill="#C4364E">blocked</text></g><text x="448" y="750" font-size="17" fill="#60708F">Nothing is written before review</text></g>
    <g filter="url(#shadow)"><rect x="58" y="518" width="314" height="250" rx="24" fill="#fff" stroke="#DCE8F7"/><circle cx="94" cy="556" r="22" fill="url(#step)"/><text x="94" y="564" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">8</text><text x="130" y="564" font-size="24" font-weight="730" fill="#102352">Fill safe fields</text><rect x="86" y="605" width="258" height="31" rx="10" fill="#F1FBF7" stroke="#9CDBBF"/><text x="104" y="626" font-size="15" fill="#17315D">Jane Doe</text><text x="314" y="626" font-size="17" fill="#16875E">✓</text><rect x="86" y="646" width="258" height="31" rx="10" fill="#F1FBF7" stroke="#9CDBBF"/><text x="104" y="667" font-size="15" fill="#17315D">jane@example.com</text><text x="314" y="667" font-size="17" fill="#16875E">✓</text><rect x="86" y="687" width="190" height="18" rx="9" fill="url(#safe)"/><text x="86" y="750" font-size="17" fill="#60708F">Submit stays manual and explicit</text></g>
    <g filter="url(#shadow)"><rect x="58" y="807" width="458" height="62" rx="20" fill="#fff" stroke="#DCE8F7"/><circle cx="92" cy="838" r="17" fill="#297AF2"/><path d="M83 838h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="122" y="834" font-size="18" font-weight="730" fill="#102352">No auto-submit</text><text x="122" y="856" font-size="14" fill="#60708F">The user stays in control.</text></g>
    <g filter="url(#shadow)"><rect x="571" y="807" width="458" height="62" rx="20" fill="#fff" stroke="#DCE8F7"/><circle cx="605" cy="838" r="17" fill="#12BFAE"/><rect x="598" y="835" width="14" height="11" rx="3" fill="#fff"/><path d="M601 835v-4a4 4 0 0 1 8 0v4" fill="none" stroke="#fff" stroke-width="3"/><text x="635" y="834" font-size="18" font-weight="730" fill="#102352">Sensitive fields blocked</text><text x="635" y="856" font-size="14" fill="#60708F">Passwords, OTP, CVV and tokens stay untouched.</text></g>
    <g filter="url(#shadow)"><rect x="1084" y="807" width="458" height="62" rx="20" fill="#fff" stroke="#DCE8F7"/><circle cx="1118" cy="838" r="17" fill="#6647F4"/><circle cx="1118" cy="833" r="5" fill="#fff"/><path d="M1109 848c2-7 16-7 18 0" fill="#fff"/><text x="1148" y="834" font-size="18" font-weight="730" fill="#102352">User review required</text><text x="1148" y="856" font-size="14" fill="#60708F">Preview is mandatory before any write.</text></g>
  </g>
</svg>
