name: CI / Firefox artifact

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and unit tests
        run: npm run check

      - name: Build extension
        run: npm run build

      - name: Mozilla manifest lint
        run: npm run lint:extension

      - name: Package ZIP and XPI
        run: npm run package

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: firefox-formfill-assist-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
