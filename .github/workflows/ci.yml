name: CI / Firefox artifact

on:
  push:
    branches: ["main", "feat/**", "fix/**", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firefox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Firefox E2E safety matrix
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-e2e-diagnostics-${{ github.sha }}
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: firefox-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bootstrap generated lockfile to release branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/release-engineering'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$HEAD_BRANCH" >/dev/null 2>&1; then
            cp package-lock.json /tmp/package-lock.json
            git fetch origin "$HEAD_BRANCH"
            git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
            if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
              echo "package-lock.json is already tracked; bootstrap skipped."
            else
              cp /tmp/package-lock.json package-lock.json
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package-lock.json
              git commit -m "chore: add generated npm lockfile"
              git push origin "HEAD:$HEAD_BRANCH"
            fi
          fi

      - name: Typecheck and unit tests
        run: npm run check

      - name: Build extension
        run: npm run build

      - name: Mozilla manifest lint
        run: npm run lint:extension

      - name: Package ZIP and XPI
        run: npm run package

      - name: Upload Firefox build and generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: firefox-formfill-assist-${{ github.sha }}
          path: |
            artifacts/*
            package-lock.json
          if-no-files-found: error
          retention-days: 30
