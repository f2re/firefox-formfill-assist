name: Release / Firefox

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/manifest.json"
  workflow_dispatch:
  issues:
    types: ["opened"]

permissions:
  contents: write
  issues: write

concurrency:
  group: firefox-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_needed: ${{ steps.meta.outputs.release_needed }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          RELEASE_NEEDED=false

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_NEEDED=true
          elif [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            if [[ "${ISSUE_TITLE}" == "[release] ${TAG}" ]]; then
              RELEASE_NEEDED=true
            fi
          else
            PREVIOUS_VERSION=$(git show "${GITHUB_SHA}^:package.json" | node -e "let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>console.log(JSON.parse(s).version));")
            if [[ "${PREVIOUS_VERSION}" != "${VERSION}" ]]; then
              RELEASE_NEEDED=true
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_needed=${RELEASE_NEEDED}" >> "$GITHUB_OUTPUT"
          echo "Release candidate: ${TAG}; needed=${RELEASE_NEEDED}"

      - name: Mark release trigger accepted
        if: github.event_name == 'issues' && steps.meta.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Release ${{ steps.meta.outputs.tag }} accepted. Running Firefox E2E and gated build. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  firefox-e2e:
    needs: prepare
    if: needs.prepare.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Firefox E2E safety matrix
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-release-e2e-diagnostics-${{ github.sha }}
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [prepare, firefox-e2e]
    if: needs.prepare.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify version, types and unit tests
        run: npm run check

      - name: Build, Mozilla lint and package
        run: |
          npm run build
          npm run lint:extension
          npm run package

      - name: Verify reproducible package bytes
        run: |
          cp artifacts/SHA256SUMS /tmp/formfill-release-SHA256SUMS
          npm run package
          diff -u /tmp/formfill-release-SHA256SUMS artifacts/SHA256SUMS

      - name: Sign unlisted XPI at AMO
        if: ${{ env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != '' }}
        run: |
          mkdir -p signed
          npx web-ext sign \
            --source-dir dist \
            --artifacts-dir signed \
            --channel unlisted
          (
            cd signed
            sha256sum ./* > SHA256SUMS
          )

      - name: Create or verify immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')

          if [[ -n "${REMOTE_SHA}" && "${REMOTE_SHA}" != "${GITHUB_SHA}" ]]; then
            NON_WORKFLOW_DIFF=$(git diff --name-only "${REMOTE_SHA}" "${GITHUB_SHA}" -- . ':(exclude).github/workflows/release.yml')
            if [[ -n "${NON_WORKFLOW_DIFF}" ]]; then
              echo "Tag ${RELEASE_TAG} already exists on ${REMOTE_SHA}; current ${GITHUB_SHA} also changes release payload files:" >&2
              echo "${NON_WORKFLOW_DIFF}" >&2
              echo "Refusing to retag or publish mismatched artifacts." >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points to ${REMOTE_SHA}; current commit differs only in release workflow. Reusing immutable tag."
          fi

          if [[ -z "${REMOTE_SHA}" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefox-formfill-assist-release-${{ env.RELEASE_TAG }}
          path: |
            artifacts/*
            signed/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FormFill Assistant ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*
            signed/*

      - name: Mark issue release published
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Published ${RELEASE_TAG}: Firefox E2E, checks, lint, deterministic packaging and GitHub Release completed. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  notify-failure:
    needs: [prepare, firefox-e2e, release]
    if: always() && github.event_name == 'issues' && needs.prepare.outputs.release_needed == 'true' && (needs.firefox-e2e.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Report failed release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Release ${{ needs.prepare.outputs.tag }} failed a gate. Firefox E2E=${{ needs.firefox-e2e.result }}, release=${{ needs.release.result }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
