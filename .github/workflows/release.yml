name: Release / Firefox

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firefox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Firefox E2E safety matrix
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-release-e2e-diagnostics-${{ github.sha }}
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: firefox-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify version, types and unit tests
        run: npm run check

      - name: Build, Mozilla lint and package
        run: |
          npm run build
          npm run lint:extension
          npm run package

      - name: Sign unlisted XPI at AMO
        if: ${{ env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != '' }}
        run: |
          mkdir -p signed
          npx web-ext sign \
            --source-dir dist \
            --artifacts-dir signed \
            --channel unlisted
          (
            cd signed
            sha256sum ./* > SHA256SUMS
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefox-formfill-assist-release-${{ github.ref_name }}
          path: |
            artifacts/*
            signed/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*
            signed/*
